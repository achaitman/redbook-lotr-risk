<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2b2014" />
  <title>The Red Book — LOTR Risk Companion</title>
  <meta name="description" content="Holdings map, turn checklist, battle adjudicator, dice, Fellowship tracker, and an offline rules oracle for Risk: The Lord of the Rings Trilogy Edition." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body style="margin:0;background:#e0d0a8">
  <div id="root"></div>
  <script>
    window.addEventListener("error", function (e) {
      var r = document.getElementById("root");
      if (r && !r.firstChild) {
        r.innerHTML = '<div style="font-family:Georgia,serif;color:#8e2f21;padding:24px;text-align:center">' +
          '<h2>The Red Book could not open</h2><p style="color:#2b2014">' + (e.message || "Unknown error") + '</p></div>';
      }
    });
  </script>
  <script src="app.js"></script>
</body>
</html>
